<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Showcase | Web Programming Lab 8</title>
  <meta name="description" content="Display captured user information including name, gender, contact info, and location dynamically rendered via client-side JavaScript.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Lights -->
  <div class="bg-ambient-orb orb-1"></div>
  <div class="bg-ambient-orb orb-2"></div>

  <main class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="badge-tag">
        <span class="badge-pulse"></span>
        Lab 8 • Display Showcase
      </div>
      <h1 class="app-title">Captured <span class="text-gradient">Profile</span> Details</h1>
      <p class="app-subtitle">
        User information received across pages using JavaScript URL Parameters &amp; Web Storage API.
      </p>
    </header>

    <!-- Main Profile Card Container -->
    <div id="profileContainer">
      <!-- Injected dynamically by display.js -->
    </div>

    <!-- History / Multiple Submissions Section -->
    <section class="history-section" id="historySection" style="display: none;">
      <div class="history-card">
        <div class="history-header">
          <h2 class="history-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="9"></circle></svg>
            Recent Captures History
          </h2>
          <button id="btnClearHistory" class="btn btn-secondary btn-sm" title="Clear all local submissions">
            Clear History
          </button>
        </div>
        <div class="table-responsive">
          <table class="records-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Gender</th>
                <th>Mobile</th>
                <th>Mail ID</th>
                <th>Location</th>
                <th>Submitted</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Bottom Navigation -->
    <div style="text-align: center; margin-top: 2rem;">
      <a href="index.html" class="btn btn-secondary" style="display: inline-flex;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Capture Another User
      </a>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="display.js"></script>
</body>
</html>
